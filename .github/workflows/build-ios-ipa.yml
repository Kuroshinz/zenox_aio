name: Build ZENOX iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA (Sideloadly / AltStore)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests and build web bundle
        run: |
          npm test
          npm run build

      - name: Sync Capacitor iOS assets
        run: npx cap sync ios

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Archive unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZENOX.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package ZENOX-unsigned.ipa
        run: |
          APP_PATH="build/ZENOX.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App.app not found inside archive"
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/App.app
          cd build/ipa
          zip -qr ../ZENOX-unsigned.ipa Payload
          ls -lh ../ZENOX-unsigned.ipa

      - name: Upload ZENOX-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZENOX-iOS-IPA
          path: build/ZENOX-unsigned.ipa
          retention-days: 30

      - name: Generate AltStore / SideStore source feed (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          IPA_SIZE=$(stat -f%z build/ZENOX-unsigned.ipa)
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > build/altstore-source.json <<EOF
          {
            "name": "ZENOX Official Source",
            "identifier": "io.zenox.source",
            "sourceURL": "https://github.com/${{ github.repository }}/releases/latest/download/altstore-source.json",
            "apps": [
              {
                "name": "ZENOX",
                "bundleIdentifier": "io.zenox.app",
                "developerName": "Zenox Development",
                "localizedDescription": "ZENOX - Hệ điều hành hiệu suất cá nhân, lịch thông minh và thể hình chu kỳ hóa khoa học.",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/public/icon-512.png",
                "tintColor": "E11D48",
                "versions": [
                  {
                    "version": "${TAG_NAME}",
                    "date": "${RELEASE_DATE}",
                    "size": ${IPA_SIZE},
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/ZENOX-unsigned.ipa"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Attach IPA & AltStore feed to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ZENOX-unsigned.ipa
            build/altstore-source.json
          generate_release_notes: true
